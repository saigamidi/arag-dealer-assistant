name: tests

# Runs the full automated test suite on every push and pull request.
# Tests never call Azure (tests/conftest.py forces bm25 / rules / stub),
# so no secrets are needed and runs cost nothing.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build the chunk index
        run: python -m src.ingest
      - name: Run tests
        run: pytest -q
